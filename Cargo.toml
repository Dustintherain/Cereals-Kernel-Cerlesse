[workspace]
resolver = "2"
# 内核仓库的 workspace：**只有内核侧**。
#
# 用户态（libc + user/*）自纯内核化起是**独立 workspace**，见 `userland/Cargo.toml`
# 与 docs/pure-kernel.md：内核提供机制、用户态提供功能。
#
# 两边的唯一接触面是编译产物 `build/userland/images/`（`make userland-images` 产出，
# 内核构建脚本按 manifest.txt 内嵌）。因此：
#   - 删掉整个 `userland/` 目录后 `cargo build -p kernel` 仍然成功（进入串口诊断模式）；
#   - 本文件不再定义 `user-release` profile（它随用户程序搬到 userland/Cargo.toml）；
#   - 边界由 `python3 tools/check-boundary.py`（`make check-boundary`）强制。
#   - `abi`（阶段三）是**系统调用 ABI 的单一事实源**：调用号 / errno / 标志位 /
#     记录布局只有一处定义，内核与 libc 都引用它（消灭 C6 的“两处镜像”）。
members = ["shared", "boot", "abi", "kernel"]
exclude = ["userland"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true

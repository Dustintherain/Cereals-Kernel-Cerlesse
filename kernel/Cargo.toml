[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
# 系统调用 ABI 的单一事实源（阶段三）：调用号 / errno / 标志位 / 记录布局。
# `no_std`、零依赖、`forbid(unsafe_code)`，因此不影响内核的构建环境假设。
abi = { path = "../abi" }

[features]
# v0.2 异常注入测试：构建后在启动末尾故意触发 #DE（make test-exception）
exception-test = []
# v0.3 页错误测试：内存初始化后访问未映射地址，断言 #PF 诊断（make test-pagefault）
pagefault-test = []
# v0.4 中断/Timer 功能门控（保留扩展用）：若启用则 IRQ0 tick 路径与串口心跳语义可在此门下验证
#interrupt-test = []
